url: https://ashgreat.github.io/endogCopulaBayes/

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, reference, news]
    right: [related, github]
  components:
    related:
      text: Related packages
      menu:
        - text: endogCopula (cross-sectional)
          href: https://ashgreat.github.io/endogCopula/
        - text: endogCopulaPanel (panel)
          href: https://ashgreat.github.io/endogCopulaPanel/
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/ashgreat/endogCopulaBayes
      aria-label: GitHub

reference:
  - title: Bayesian copula sampler
    desc: >
      Metropolis-within-Gibbs sampler for the Bayesian Gaussian copula
      endogeneity correction of Haschka (2026).
    contents:
      - CopRegBayes

  - title: Diagnostics
    desc: >
      MCMC convergence diagnostics for a fitted sampler.
    contents:
      - diagnostics
      - diagnostics.endog_copula_bayes

  - title: Methods
    desc: >
      Methods for objects returned by CopRegBayes().
    contents:
      - print.endog_copula_bayes
      - summary.endog_copula_bayes
      - print.summary.endog_copula_bayes
      - plot.endog_copula_bayes
